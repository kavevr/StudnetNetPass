[package]
name = "studnetnetpass"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
config = "0.15.23"
serde = { version = "1.0.228", features = ["derive"] }
reqwest = { version = "0.13.3" }
tokio = { version = "1.52.3", features = [ "macros","rt-multi-thread"] }
clap = { version = "4.6.1", features = ["derive"] }
serde_urlencoded = "0.7"
url = "2.5.8"
regex = "1.12.3"

[profile.release]
opt-level = "z"  
lto = true       
codegen-units = 1 
strip = true     
